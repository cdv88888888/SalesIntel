name: Volume alert agents

# Runs the volume-watch agents every two days at 6:00 AM Manila time
# (22:00 UTC the evening before), and on demand from the Actions tab.
on:
  schedule:
    - cron: '0 22 */2 * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Run the agents
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "The CRON_SECRET repository secret is not set." >&2
            exit 1
          fi
          BASE=https://sales-intel--sales-intel-cdv-2026.asia-east1.hosted.app

          # 1. Mark new and recovered accounts, write per-account explanations.
          summary=$(curl --fail-with-body --silent --show-error --max-time 420 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/alerts")
          echo "$summary"

          # 2. One investigating agent per batch, one request each.
          failed=0
          for agent in $(echo "$summary" | jq -r '.agentKeys[]?'); do
            echo "--- $agent"
            curl --fail-with-body --silent --show-error --max-time 420 \
              -X POST -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE/api/cron/alerts/brief?agent=$agent" || failed=1
            echo
          done
          exit $failed
