# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Firebase web config (NEXT_PUBLIC_FIREBASE_*) is NOT listed here: App Hosting
# injects FIREBASE_WEBAPP_CONFIG for the associated web app and next.config.mjs
# maps it onto the NEXT_PUBLIC_* variables at build time.
#
# Secrets referenced with `secret:` below live in Secret Manager. The App
# Hosting compute service account
# (firebase-app-hosting-compute@<project>.iam.gserviceaccount.com) must be
# granted "Secret Manager Secret Accessor" on each one, e.g.
#   firebase apphosting:secrets:grantaccess <SECRET> --backend <backend-id>

runConfig:
  # A single Business Intelligence request runs several BigQuery jobs and holds
  # their result sets in memory; 512MiB was not enough headroom for that plus
  # the Next.js server, and an out-of-memory kill surfaces as an empty page.
  cpu: 2
  memoryMiB: 2048
  minInstances: 0
  maxInstances: 10
  # Fewer requests per instance, so several heavy pages at once cannot pile up
  # in one container's memory.
  concurrency: 20

env:
  # SESSION_SECRET (signs the __session cookie) is NOT declared here. It is set
  # as a console environment-variable override on the backend
  # (App Hosting > backend > Settings > Environment > Add new), which needs no
  # Secret Manager IAM grants. Once Secret Manager access is sorted out it can
  # move back to a `secret:` reference like the entries below.
  #
  # It is required: src/lib/session.js has no committed fallback key, so a
  # deployment without it fails closed - login returns 503 and every existing
  # cookie is rejected. Check the override first if sign-in breaks after a
  # rollout.

  # BigQuery jobs run in the project that owns the sales dataset. With no
  # BQ_CREDENTIALS_JSON set, the BigQuery client authenticates as the App
  # Hosting compute service account, which must hold BigQuery Data Viewer and
  # BigQuery Job User on this project.
  - variable: BQ_PROJECT_ID
    value: "accounts-recieva"
    availability:
      - RUNTIME

  # Monday.com board ids (plain value).
  - variable: MONDAY_BOARD_ID
    value: "1244621950,1250913155"
    availability:
      - RUNTIME

  # --- Secret Manager references (all disabled for now) --------------------
  # Each entry below is disabled until the matching secret exists and the
  # App Hosting compute service account has "Secret Manager Secret Accessor"
  # on it. A referenced-but-missing secret fails the rollout in the preparer
  # step. Re-enable one at a time as the secrets are created.
  #
  # - variable: GEMINI_API_KEY          # Gemini chat widget
  #   secret: GEMINI_API_KEY
  #   availability:
  #     - RUNTIME
  # - variable: MONDAY_API_TOKEN        # Monday.com CRM updates feed
  #   secret: MONDAY_API_TOKEN
  #   availability:
  #     - RUNTIME
  # - variable: BQ_CREDENTIALS_JSON     # BigQuery service-account JSON
  #   secret: BQ_CREDENTIALS_JSON
  #   availability:
  #     - RUNTIME

  # Fallback whitelist when Firestore's whitelisted_users is unavailable.
  - variable: AUTH_WHITELIST
    value: "cdv@masaganagas.com:admin,janalbert.santos@masaganagas.com:admin,maclaire.jabines@masaganagas.com:viewer,jenette.morente@masaganagas.com:viewer,anton.antonio@masaganagas.com:viewer,melroziene.dorio@masaganagas.com:viewer,patrick.yao@masaganagas.com:viewer,marialourdes.jordan@masaganagas.com:viewer,nora.sulit@masaganagas.com:viewer,anna.neri@masaganagas.com:viewer,hanes.llamas@masaganagas.com:viewer,richardyao@masaganagas.com:viewer,kristinelara.rizos@masaganagas.com:viewer,altheamarie.eda@masaganagas.com:viewer,beatriz.maayo@masaganagas.com:viewer"
    availability:
      - RUNTIME
